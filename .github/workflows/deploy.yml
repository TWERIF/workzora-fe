name: Deploy frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Pull, build and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          PM2_APP: ${{ vars.PM2_APP || 'workzora-fe' }}
          BUILD_MEMORY_MB: ${{ vars.BUILD_MEMORY_MB || '2048' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          envs: PM2_APP,BUILD_MEMORY_MB
          timeout: 120s
          command_timeout: 95m
          script: |
            set -e
            exec 9>/var/lock/workzora-deploy.lock
            echo "Waiting for other deploys to finish"
            flock -w 3600 9
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /var/www/workzora-fe

            run_app() {
              if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
                pm2 restart "$PM2_APP" --update-env
              else
                pm2 start npm --name "$PM2_APP" -- start
              fi
              pm2 save
            }

            BEFORE=$(git rev-parse HEAD)
            git checkout main
            git pull --ff-only origin main
            AFTER=$(git rev-parse HEAD)
            echo "Deploying $BEFORE -> $AFTER"

            if [ ! -d node_modules ] || ! git diff --quiet "$BEFORE" "$AFTER" -- package.json package-lock.json; then
              npm ci
            fi

            rm -rf .next-previous
            if [ -d .next ]; then
              cp -a .next .next-previous
            fi

            if ! NODE_OPTIONS="--max-old-space-size=${BUILD_MEMORY_MB:-2048}" npm run build; then
              echo "Build failed, restoring the previous build" >&2
              if [ -d .next-previous ]; then
                rm -rf .next
                mv .next-previous .next
                run_app
              fi
              exit 1
            fi

            run_app
            rm -rf .next-previous
            pm2 status
